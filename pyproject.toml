[project]
name = "max-geometric-rail-speed"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "geopandas>=1.1.4",
    "numpy>=2.5.1",
    "pyogrio>=0.13.0",
    "pypdf>=6.14.2",
    "pyproj>=3.7.2",
    "scipy>=1.18.0",
    "shapely>=2.1.2",
    "typer>=0.27.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "ty>=0.0.66",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint.flake8-bugbear]
# typer.Argument()/typer.Option() as parameter defaults is the library's own
# idiom (it reads the call at import time to build the CLI), not the mutable-
# default-argument bug B008 exists to catch.
extend-immutable-calls = ["typer.Argument", "typer.Option"]
